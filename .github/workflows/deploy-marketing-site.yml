name: Deploy marketing site to GitHub Pages

# Publishes marketing-site/ (plain static HTML/CSS/JS, no build step) to
# GitHub Pages on every push to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "marketing-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload marketing-site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
